# Claims Intelligence Engine: `docker compose up --build` -> http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cie_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-cie}
    volumes:
      - pgdata:/var/lib/postgresql/data # persistent database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cie}:${POSTGRES_PASSWORD:-cie_local_password}@db:5432/${POSTGRES_DB:-cie}?schema=public
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:8787}
      CLAUDE_BRIDGE_TOKEN: ${CLAUDE_BRIDGE_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      CLAUDE_TIMEOUT_MS: ${CLAUDE_TIMEOUT_MS:-180000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach the Claude bridge on the host (Linux too)
    volumes:
      - uploads:/data/uploads # persistent evidence PDFs

volumes:
  pgdata:
  uploads:
